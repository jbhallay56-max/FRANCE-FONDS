<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FRANCE — Espace client</title>
  <link rel="stylesheet" href="/style.css"/>
</head>

<body>
  <main class="wrap">
    <header class="top">
      <a class="brand" href="/index.html">FRANCE</a>
      <nav class="nav">
        <a href="/index.html">Accueil</a>
        <a href="/marche.html">Marché & chiffres</a>
      </nav>
    </header>

    <section class="card">
      <h1>Espace client</h1>
      <p class="muted">Suivi — allocation, décisions, risques, justification. (Prototype)</p>

      <div id="state" class="muted">Chargement…</div>

      <div id="box" style="display:none">
        <div class="grid">
          <div class="row between">
            <div>
              <div class="tiny muted">Nom</div>
              <div id="name" class="big">—</div>
            </div>
            <button id="logout" class="btn">Se déconnecter</button>
          </div>

          <div class="sep"></div>

          <div class="row">
            <div style="flex:1">
              <div class="tiny muted">Email</div>
              <div id="mail">—</div>
            </div>
          </div>

          <div class="row">
            <div style="flex:1">
              <div class="tiny muted">Adresse</div>
              <div id="addr">—</div>
            </div>
          </div>

          <div class="row">
            <div style="flex:1">
              <div class="tiny muted">Téléphone</div>
              <div id="phone">—</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
  async function loadMe(){
    const state = document.getElementById("state");
    const box   = document.getElementById("box");

    const nameEl  = document.getElementById("name");
    const mailEl  = document.getElementById("mail");
    const addrEl  = document.getElementById("addr");
    const phoneEl = document.getElementById("phone");
    const logoutBtn = document.getElementById("logout");

    try{
      const r = await fetch("/api/me", { credentials: "include" });
      const data = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error(data.error || "Not authenticated");

      // OK
      if(state) state.style.display = "none";
      if(box) box.style.display = "block";

      const u = data.user || {};
      nameEl.textContent  = (u.first_name ? (u.first_name + " ") : "") + (u.last_name || "");
      mailEl.textContent  = u.email || "—";
      addrEl.textContent  = (u.address || "—") + (u.postal ? (" — " + u.postal) : "");
      phoneEl.textContent = u.phone || "—";

      logoutBtn.addEventListener("click", async () => {
        await fetch("/api/logout", { method:"POST", credentials:"include" });
        window.location.href = "/login.html";
      });

    } catch(e){
      if(state) state.textContent = "Session expirée. Redirection…";
      setTimeout(() => { window.location.href = "/login.html"; }, 600);
    }
  }

  document.addEventListener("DOMContentLoaded", loadMe);
  </script>
</body>
</html>
